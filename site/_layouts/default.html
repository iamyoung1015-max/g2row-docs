<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ===== 검색엔진 차단 ===== -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="naver-site-verification" content="">
<meta name="referrer" content="no-referrer">
<!-- ======================== -->

<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#content">본문으로</a>

<header class="topbar">
  <a class="brand" href="{{ '/' | relative_url }}">G2ROW 내부 문서</a>
  <button class="navtoggle" aria-label="메뉴" onclick="document.body.classList.toggle('navopen')">☰</button>
</header>

<div class="shell">

  <nav class="sidebar" aria-label="문서 목록">
    <p class="navlabel">사업전략</p>
    <ul>
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on"{% endif %}>개요</a></li>
      <li><a href="{{ '/01-business-direction.html' | relative_url }}"{% if page.url contains '01-business' %} class="on"{% endif %}>01. 사업계획 방향</a></li>
      <li><a href="{{ '/02-benchmarking.html' | relative_url }}"{% if page.url contains '02-benchmarking' %} class="on"{% endif %}>02. 벤치마킹 리서치</a></li>
    </ul>
  </nav>

  <main class="content" id="content">
    {{ content }}
  </main>

</div>

<footer class="foot">
  <span>G2ROW 내부 작업 문서</span>
  <span class="sep">·</span>
  <span>최종 빌드 {{ site.time | date: "%Y-%m-%d %H:%M" }}</span>
</footer>

<script>
// 목차 자동 생성 (h2 기준)
(function () {
  var main = document.getElementById('content');
  if (!main) return;
  var hs = main.querySelectorAll('h2');
  if (hs.length < 3) return;
  var box = document.createElement('nav');
  box.className = 'toc';
  var html = '<p class="toclabel">목차</p><ul>';
  hs.forEach(function (h) {
    if (!h.id) return;
    html += '<li><a href="#' + h.id + '">' + h.textContent + '</a></li>';
  });
  box.innerHTML = html + '</ul>';
  var first = main.querySelector('h1');
  if (first && first.nextSibling) main.insertBefore(box, first.nextSibling);
  else main.insertBefore(box, main.firstChild);
})();
</script>

</body>
</html>
